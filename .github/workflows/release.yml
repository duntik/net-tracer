name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension zip
        run: |
          mkdir -p dist
          cp -r extension dist/net-tracer
          cd dist && zip -rq net-tracer-extension.zip net-tracer
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Net Tracer ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          files: dist/net-tracer-extension.zip
          body: |
            Chrome / Edge extension (Manifest V3) that highlights wire nets in vector PDF schematics.

            **Install:** unzip `net-tracer-extension.zip` → `chrome://extensions` → enable *Developer mode* → *Load unpacked* → select the `net-tracer` folder. For local PDFs enable *Allow access to file URLs*. See the README for details.
