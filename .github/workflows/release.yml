name: Release

# Every push to main whose extension/manifest.json version has no tag yet becomes a tagged release
# with the zip attached and the CHANGELOG section as notes. Bump with: node scripts/version.mjs X.Y.Z
on:
  push:
    branches: [main]
    paths: ['extension/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          node scripts/version.mjs
          echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if already tagged
        id: tag
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build zip and notes
        if: steps.tag.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp -r extension dist/net-tracer
          rm -f dist/net-tracer/.gitignore
          (cd dist && zip -rq net-tracer-extension.zip net-tracer)
          node scripts/version.mjs --notes > dist/notes.md
          printf '\n\n**Install:** unzip `net-tracer-extension.zip` → `chrome://extensions` → *Developer mode* → *Load unpacked* → select the `net-tracer` folder. Web version: https://duntik.github.io/net-tracer/app/\n' >> dist/notes.md
      - name: Publish release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Net Tracer v${{ steps.v.outputs.version }}
          body_path: dist/notes.md
          files: dist/net-tracer-extension.zip
