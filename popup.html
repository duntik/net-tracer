<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Net Tracer</title>
<style>
  body { width: 260px; margin: 0; padding: 12px; background: #1d2128; color: #e6e8eb; font: 13px/1.4 system-ui, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 7px 10px; background: #2b313b; color: #e6e8eb; border: 1px solid #3a414d; border-radius: 6px; cursor: pointer; font: inherit; text-align: left; }
  button:hover { background: #353c48; }
  button.primary { background: #ffb020; color: #000; border-color: #ffb020; font-weight: 600; }
  label { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; cursor: pointer; }
  .hint { color: #8a93a2; font-size: 11px; }
</style></head>
<body>
  <h1>Schematic Net Tracer</h1>
  <button id="openCurrent" class="primary">Открыть текущую вкладку в Net Tracer</button>
  <button id="openViewer">Открыть Net Tracer (выбрать файл)</button>
  <label><input type="checkbox" id="intercept"> Перехватывать открытие .pdf</label>
  <div class="hint">Любой http(s)-адрес, оканчивающийся на .pdf, будет открываться в Net Tracer. Локальные файлы (file://) — через кнопку выше или перетаскиванием.</div>
  <script src="js/popup.js"></script>
</body></html>
